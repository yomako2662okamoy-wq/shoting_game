<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcane Barrage - 魔法弾幕シューティング</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08060F;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden}
#game-container{position:relative;width:480px;max-width:100vw;user-select:none;-webkit-user-select:none}
canvas{width:100%;display:block;border-radius:12px;border:1px solid rgba(175,169,236,0.15);cursor:none}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:center;align-items:center}
.screen{display:none;text-align:center;pointer-events:auto;padding:20px}
.screen.active{display:block}
.title{font-size:32px;font-weight:600;color:#E6D5FF;text-shadow:0 0 30px rgba(127,119,221,0.7),0 0 60px rgba(127,119,221,0.3);margin-bottom:4px;letter-spacing:2px}
.sub{font-size:13px;color:#AFA9EC;margin-bottom:28px;letter-spacing:4px}
.btn{background:rgba(127,119,221,0.2);color:#CECBF6;border:1px solid rgba(175,169,236,0.35);padding:12px 36px;border-radius:24px;font-size:15px;cursor:pointer;transition:all .25s;letter-spacing:1px}
.btn:hover{background:rgba(127,119,221,0.4);transform:scale(1.05);box-shadow:0 0 20px rgba(127,119,221,0.3)}
.btn-green{background:rgba(99,153,34,0.2);color:#C0DD97;border-color:rgba(151,196,89,0.35)}
.btn-green:hover{background:rgba(99,153,34,0.4);box-shadow:0 0 20px rgba(99,153,34,0.3)}
.btn-gold{background:rgba(186,117,23,0.2);color:#FAC775;border-color:rgba(239,159,39,0.35)}
.btn-gold:hover{background:rgba(186,117,23,0.4);box-shadow:0 0 20px rgba(186,117,23,0.3)}
.info-text{font-size:14px;color:#D3D1C7;margin-bottom:16px}
.go-title{font-size:26px;font-weight:600;color:#F09595;margin-bottom:6px;text-shadow:0 0 20px rgba(226,75,74,0.4)}
.clear-title{font-size:26px;font-weight:600;color:#97C459;margin-bottom:6px;text-shadow:0 0 20px rgba(151,196,89,0.4)}
.win-title{font-size:32px;font-weight:600;color:#FAC775;text-shadow:0 0 30px rgba(239,159,39,0.6);margin-bottom:6px}
.controls{margin-top:12px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:11px;color:#666;letter-spacing:0.5px}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gc" width="480" height="640"></canvas>
<div id="ui-overlay">
  <div id="title-screen" class="screen active">
    <div class="title">ARCANE BARRAGE</div>
    <div class="sub">魔法弾幕シューティング</div>
    <button class="btn" id="start-btn">START</button>
  </div>
  <div id="go-screen" class="screen">
    <div class="go-title">GAME OVER</div>
    <div class="info-text" id="go-score"></div>
    <button class="btn" id="retry-btn">リトライ</button>
  </div>
  <div id="sc-screen" class="screen">
    <div class="clear-title">STAGE CLEAR!</div>
    <div class="info-text" id="sc-score"></div>
    <button class="btn btn-green" id="next-btn">次のステージへ</button>
  </div>
  <div id="win-screen" class="screen">
    <div class="win-title">VICTORY!</div>
    <div class="info-text" id="win-score"></div>
    <button class="btn btn-gold" id="replay-btn">最初からプレイ</button>
    <div style="margin-top:12px">
      <button class="btn" id="ngplus-btn" style="background:rgba(239,159,39,0.15);color:#FAC775;border-color:rgba(239,159,39,0.5)">2周目：ビーム撃ち放題</button>
    </div>
  </div>
</div>
</div>
<div class="controls">
  <span>マウス追従 / WASD / 矢印キー</span>
  <span>自動射撃</span>
  <span>Space / クリック = ビーム発動</span>
</div>

['#0D0B1A','rgba(175,169,236,','rgba(133,183,235,','rgba(127,119,221,0.08)'],
['#0B1218','rgba(93,202,165,','rgba(159,225,203,','rgba(29,158,117,0.07)'],
['#18100B','rgba(240,153,123,','rgba(245,196,179,','rgba(216,90,48,0.06)'],
['#130B18','rgba(237,147,177,','rgba(244,192,209,','rgba(212,83,126,0.07)'],

const BNAMES=[null,'Shadow Imp','Venom Drake','Flame Golem','Void Witch','Archmage Zephyr','Phantom God'];
const SNAMES=[null,'影の洞窟','毒の沼地','炎の山脈','虚空の神殿','大魔導の塔','幻魔の深淵'];
let state='title',score=0,stage=1,lives=3,pw=0;
let pl,bl,en,eb,pt,pu,stars;
let bossAlive=false,bossSpawned=false,spawnT=0,fc=0,killCount=0,clearDelay=0;
let keys={},mousePos=null,mouseOn=false;
let beam={on:false,t:0,stock:0};
let ngPlus=false;
let speedBoost={active:false,timer:0};
let combo=0,comboTimer=0,comboDisplay=0;
let shake={x:0,y:0,t:0,intensity:0};
let stageAnnounce=0,warningTimer=0,bossNameDisplay='';

const AC=typeof AudioContext!=='undefined'?new AudioContext():null;
function tone(f,d,v,tp){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'square';o.frequency.value=f;g.gain.setValueAtTime(v||0.04,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sfxShoot(){tone(800,0.04,0.015,'square')}
function sfxHit(){tone(200,0.06,0.03,'sawtooth')}
function sfxKill(){tone(600,0.1,0.04,'triangle')}
function sfxPU(){tone(1000,0.12,0.03,'sine');tone(1200,0.12,0.025,'sine')}
function sfxBeam(){tone(150,0.3,0.05,'sawtooth')}
function sfxWarn(){tone(100,0.5,0.05,'square')}
function sfxDmg(){tone(150,0.2,0.05,'sawtooth')}
function sfxBossDie(){for(let i=0;i<5;i++)setTimeout(()=>tone(100+i*80,0.3,0.04,'sawtooth'),i*80)}

function initStars(){stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.3,v:Math.random()*0.8+0.1,layer:Math.floor(Math.random()*3)})}
initStars();

function resetStage(){pl={x:W/2,y:H-70,sp:5.5,inv:0};bl=[];en=[];eb=[];pt=[];pu=[];spawnT=0;bossAlive=false;bossSpawned=false;fc=0;killCount=0;clearDelay=-1;stageAnnounce=120;warningTimer=0;bossNameDisplay=''}

function startGame(){score=0;stage=1;lives=3;pw=0;beam={on:false,t:0,stock:0};ngPlus=false;combo=0;comboTimer=0;comboDisplay=0;resetStage();state='playing';showOnly(null);if(AC&&AC.state==='suspended')AC.resume()}
function startNGPlus(){score=0;stage=1;lives=5;pw=5;beam={on:true,t:99999,stock:0};ngPlus=true;combo=0;comboTimer=0;comboDisplay=0;resetStage();state='playing';showOnly(null);if(AC&&AC.state==='suspended')AC.resume()}
function nextStage(){const bs=beam.stock,sp=pw,ng=ngPlus;stage++;resetStage();beam.stock=bs;pw=sp;if(ng){ngPlus=true;beam.on=true;beam.t=99999;pw=5}state='playing';showOnly(null)}
function showOnly(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));if(id)document.getElementById(id).classList.add('active')}

document.getElementById('start-btn').onclick=startGame;
document.getElementById('retry-btn').onclick=startGame;
document.getElementById('next-btn').onclick=nextStage;
document.getElementById('replay-btn').onclick=startGame;
document.getElementById('ngplus-btn').onclick=startNGPlus;

function activateBeam(){if(state==='playing'&&beam.stock>0&&!beam.on){beam.stock--;beam.on=true;beam.t=210;addPt(pl.x,pl.y,'#85B7EB',25);sfxBeam()}}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' ')activateBeam()});
document.addEventListener('keyup',e=>keys[e.key]=false);
function cPos(e){const r=cv.getBoundingClientRect(),src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)/r.width*W,y:(src.clientY-r.top)/r.height*H}}
cv.addEventListener('mouseenter',e=>{mouseOn=true;mousePos=cPos(e)});
cv.addEventListener('mousemove',e=>{if(mouseOn)mousePos=cPos(e)});
cv.addEventListener('mouseleave',()=>{mouseOn=false;mousePos=null});
cv.addEventListener('click',()=>{if(state==='playing')activateBeam()});
cv.addEventListener('touchstart',e=>{e.preventDefault();mouseOn=true;mousePos=cPos(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();mousePos=cPos(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();mouseOn=false;mousePos=null},{passive:false});

function addShake(n){shake.t=12;shake.intensity=n||4}
function addPt(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30+Math.random()*20,ml:50,c,r:Math.random()*3+1})}}
function addExp(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:40+Math.random()*30,ml:70,c,r:Math.random()*4+2})}}

function dropItem(x,y,isBoss){
const dropRate=stage>=4?0.35:0.25;
if(Math.random()<dropRate||isBoss){const r=Math.random();
const tp=stage>=4?(r<0.2?'power':r<0.45?'life':r<0.75?'beam':'speed'):(r<0.3?'power':r<0.5?'life':r<0.8?'beam':'speed');
pu.push({x,y,vy:1.5,tp,tm:360})}
if(isBoss){pu.push({x:x-20,y,vy:1.5,tp:'life',tm:360});pu.push({x:x+20,y,vy:1.5,tp:'life',tm:360});pu.push({x,y:y+15,vy:1.5,tp:'beam',tm:360})}
}

function update(){
if(state!=='playing')return;fc++;
if(stageAnnounce>0)stageAnnounce--;
if(shake.t>0){shake.t--;shake.x=(Math.random()-0.5)*shake.intensity*(shake.t/12);shake.y=(Math.random()-0.5)*shake.intensity*(shake.t/12)}else{shake.x=0;shake.y=0}

if(keys['ArrowLeft']||keys['a'])mx=-1;if(keys['ArrowRight']||keys['d'])mx=1;
if(keys['ArrowUp']||keys['w'])my=-1;if(keys['ArrowDown']||keys['s'])my=1;
if(mx&&my){mx*=0.707;my*=0.707}pl.x+=mx*spd;pl.y+=my*spd;
if(mousePos){const dx=mousePos.x-pl.x,dy=mousePos.y-pl.y,di=Math.sqrt(dx*dx+dy*dy);if(di>2){const s=Math.min(spd,di);pl.x+=(dx/di)*s;pl.y+=(dy/di)*s}}
pl.x=Math.max(14,Math.min(W-14,pl.x));pl.y=Math.max(20,Math.min(H-20,pl.y));
if(pl.inv>0)pl.inv--;
if(fc%7===0)playerShoot();updateBeam();

// Stage 6: constant healing items from the sky (even during boss)
if(stage===6&&fc%80===0){pu.push({x:Math.random()*(W-60)+30,y:-10,vy:2,tp:'life',tm:400})}

spawnT++;let kt=6+stage*3;if(stage===5)kt=Math.ceil(kt*1.2);if(stage===6)kt=33;
if(!bossSpawned){
if(killCount>=kt){if(warningTimer===0&&!bossAlive){warningTimer=90;sfxWarn()}if(warningTimer===1)spawnBoss()}
else{const iv=stage===6?45:Math.max(20,75-stage*11);if(spawnT%iv===0){const r=Math.random();const spreaderCount=en.filter(e=>e.t==='spreader').length;const teleCount=en.filter(e=>e.t==='teleporter').length;
if(stage===6){if(spreaderCount<5&&r<0.25)spawnEnemy('spreader');else if(teleCount<4&&r<0.45)spawnEnemy('teleporter');else if(r<0.65)spawnEnemy('tank');else if(r<0.85)spawnEnemy('zigzag');else spawnEnemy('basic')}
else if(stage===4&&spreaderCount<4&&r<0.18)spawnEnemy('spreader');
else if(stage>=5&&spreaderCount<6&&r<0.2)spawnEnemy('spreader');
else if(stage>=5&&teleCount<3&&r<0.35)spawnEnemy('teleporter');
else if(r<0.5)spawnEnemy('basic');else if(r<0.8)spawnEnemy('zigzag');else spawnEnemy('tank')}}}

bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy});bl=bl.filter(b=>b.y>-10&&b.x>-10&&b.x<W+10);

en.forEach(e=>{if(e.flash>0)e.flash--;
if(e.t==='boss'){if(e.y<e.ty)e.y+=1.5;else{e.x+=e.d*e.sp;if(e.x<60||e.x>W-60)e.d*=-1;if(stage>=5)e.ph=e.hp<e.mh*0.33?2:e.hp<e.mh*0.66?1:0;else e.ph=e.hp<e.mh*0.5?1:0}e.st--;if(e.st<=0){enemyShoot(e);e.st=([0,55,50,48,42,38,28][stage]||45)-e.ph*4}}
else if(e.t==='spreader'){e.y+=e.sp*0.5;e.x+=e.d*e.sp*0.8;if(e.x<30||e.x>W-30)e.d*=-1;if(e.bcd>0)e.bcd--;else{e.st--;if(e.st<=0){enemyShoot(e);e.bc++;e.st=10;if(e.bc>=e.bm){e.bc=0;e.bcd=110;e.st=25}}}}
else if(e.t==='teleporter'){e.y+=e.sp*0.4;if(e.teleCD>0){e.teleCD--;e.alpha=e.teleCD>20?Math.max(0,(30-e.teleCD)/10):Math.min(1,(20-e.teleCD)/10);if(e.teleCD===20){e.x=Math.random()*(W-60)+30;e.y=Math.max(40,pl.y-150-Math.random()*100)}}else{e.alpha=1;e.st--;if(e.st<=0){enemyShoot(e);e.st=50+Math.random()*30}if(Math.random()<0.005)e.teleCD=30}}
else if(e.t==='basic'){e.y+=e.sp;e.st--;if(e.st<=0){enemyShoot(e);e.st=90+Math.random()*50}}
else if(e.t==='zigzag'){e.y+=e.sp*0.7;e.x+=e.d*e.sp;if(e.x<20||e.x>W-20)e.d*=-1;e.st--;if(e.st<=0){enemyShoot(e);e.st=60+Math.random()*35}}

bl.forEach(b=>{en.forEach(e=>{if(e.t==='teleporter'&&e.alpha<0.3)return;if(Math.abs(b.x-e.x)<(e.w/2+b.r)&&Math.abs(b.y-e.y)<(e.h/2+b.r)&&b.y>0){e.hp-=b.dm;b.y=-999;e.flash=4;addPt(b.x,b.y,'#FFF',2);sfxHit();if(e.hp<=0)killEnemy(e)}})});
bl=bl.filter(b=>b.y>-10);en=en.filter(e=>e.y>-9998);

if(pl.inv<=0){eb.forEach(b=>{if(Math.abs(b.x-pl.x)<12&&Math.abs(b.y-pl.y)<12){b.y=9999;lives--;pl.inv=100;addPt(pl.x,pl.y,'#F09595',20);addShake(6);sfxDmg();if(lives<=0){state='gameover';document.getElementById('go-score').textContent='スコア: '+score.toLocaleString()+' | ステージ '+stage;showOnly('go-screen')}}})}

pu=pu.filter(p=>p.tm>0&&p.y<H+20);

if(bossSpawned&&!bossAlive&&clearDelay===-1){
clearDelay=240;
}
if(clearDelay>0){clearDelay--;
if(clearDelay===0){clearDelay=-2;
const maxStg=ngPlus?6:MAXS;
if(stage>=maxStg){state='win';document.getElementById('win-score').textContent='最終スコア: '+score.toLocaleString()+(ngPlus?' [2周目クリア！]':'');showOnly('win-screen')}
else{state='clear';document.getElementById('sc-score').textContent='スコア: '+score.toLocaleString()+' | ステージ '+stage+' クリア！';showOnly('sc-screen')}}
}

cx.fillStyle=beam.on?'#DCF0FF':'#B5D4F4';cx.beginPath();cx.moveTo(0,-12);cx.lineTo(-7,6);cx.lineTo(0,3);cx.lineTo(7,6);cx.closePath();cx.fill()}
const gw=cx.createRadialGradient(0,2,0,0,2,22);gw.addColorStop(0,beam.on?'rgba(180,220,255,0.4)':'rgba(133,183,235,0.25)');gw.addColorStop(1,'rgba(133,183,235,0)');cx.fillStyle=gw;cx.fillRect(-22,-18,44,38);cx.restore()}

function drawEnemy(e){cx.save();cx.translate(e.x,e.y);
if(e.t==='teleporter')cx.globalAlpha=e.alpha||1;
if(e.flash>0)cx.globalAlpha=0.5+Math.sin(fc*2)*0.3;
if(e.t==='boss'){const s2=1+Math.sin(fc*0.04)*0.03;cx.scale(s2,s2);const hw=e.w/2,hh=e.h/2;
if(stage===1&&IMGS.boss1&&IMGS.boss1.complete){cx.drawImage(IMGS.boss1,-hw,-hh,hw*2,hh*2)}else{
cx.fillStyle=e.c;cx.beginPath();cx.moveTo(0,-hh);cx.lineTo(-hw,-hh*0.3);cx.lineTo(-hw*0.8,hh);cx.lineTo(hw*0.8,hh);cx.lineTo(hw,-hh*0.3);cx.closePath();cx.fill();
cx.fillStyle='rgba(0,0,0,0.2)';cx.beginPath();cx.moveTo(0,-hh*0.6);cx.lineTo(-hw*0.5,0);cx.lineTo(-hw*0.3,hh*0.6);cx.lineTo(hw*0.3,hh*0.6);cx.lineTo(hw*0.5,0);cx.closePath();cx.fill();
const eg=e.ph>=1?'#FFF':'#F09595';cx.fillStyle=eg;cx.beginPath();cx.arc(-hw*0.25,-hh*0.1,5+stage,0,Math.PI*2);cx.arc(hw*0.25,-hh*0.1,5+stage,0,Math.PI*2);cx.fill();
cx.fillStyle='#501313';cx.beginPath();cx.arc(-hw*0.25,-hh*0.1,3,0,Math.PI*2);cx.arc(hw*0.25,-hh*0.1,3,0,Math.PI*2);cx.fill();
cx.fillStyle=e.c;cx.beginPath();cx.moveTo(-hw*0.4,-hh);cx.lineTo(-hw*0.6,-hh-15-stage*2);cx.lineTo(-hw*0.15,-hh*0.6);cx.closePath();cx.moveTo(hw*0.4,-hh);cx.lineTo(hw*0.6,-hh-15-stage*2);cx.lineTo(hw*0.15,-hh*0.6);cx.closePath();cx.fill();
if(e.ph>=1){cx.fillStyle='rgba(255,100,100,0.08)';cx.beginPath();cx.arc(0,0,hw*1.3,0,Math.PI*2);cx.fill()}}
const hp=e.hp/e.mh;cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(-hw,hh+8,hw*2,6);cx.fillStyle=hp>0.5?'#97C459':hp>0.25?'#EF9F27':'#E24B4A';cx.fillRect(-hw,hh+8,hw*2*hp,6);cx.fillStyle='rgba(255,255,255,0.3)';cx.fillRect(-hw,hh+8,hw*2*hp,2);
if(bossNameDisplay){cx.fillStyle='rgba(255,255,255,0.5)';cx.font='10px sans-serif';cx.textAlign='center';cx.fillText(bossNameDisplay,0,hh+22)}}
else if(e.t==='spreader'){const p2=1+Math.sin(fc*0.1)*0.08;cx.scale(p2,p2);if(IMGS.spreader&&IMGS.spreader.complete&&e.flash<=0){cx.drawImage(IMGS.spreader,-20,-20,40,40)}else{cx.fillStyle=e.flash>0?'#FFF':e.c;cx.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/2,r=i%2===0?16:9;if(i===0)cx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill();cx.fillStyle='#412402';cx.beginPath();cx.arc(-5,-2,3,0,Math.PI*2);cx.arc(5,-2,3,0,Math.PI*2);cx.fill()}}
else if(e.t==='teleporter'){if(IMGS.teleporter&&IMGS.teleporter.complete&&e.flash<=0){cx.drawImage(IMGS.teleporter,-20,-20,40,40)}else{cx.fillStyle=e.flash>0?'#FFF':e.c;cx.beginPath();for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2-Math.PI/2,r=i%2===0?14:7;if(i===0)cx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill();cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.arc(-3,-2,2.5,0,Math.PI*2);cx.arc(3,-2,2.5,0,Math.PI*2);cx.fill()}if(e.teleCD>0){cx.strokeStyle='rgba(206,203,246,'+((30-Math.abs(e.teleCD-15))/30)+')';cx.lineWidth=1.5;cx.beginPath();cx.arc(0,0,22+Math.sin(fc*0.2)*4,0,Math.PI*2);cx.stroke()}}
else if(e.t==='basic'){if(IMGS.basic&&IMGS.basic.complete&&e.flash<=0){cx.drawImage(IMGS.basic,-20,-20,40,40)}else{cx.fillStyle=e.flash>0?'#FFF':e.c;cx.beginPath();cx.arc(0,0,12,0,Math.PI*2);cx.fill();cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.arc(-4,-2,3,0,Math.PI*2);cx.arc(4,-2,3,0,Math.PI*2);cx.fill()}}
else if(e.t==='zigzag'){if(IMGS.zigzag&&IMGS.zigzag.complete&&e.flash<=0){cx.drawImage(IMGS.zigzag,-20,-20,40,40)}else{cx.fillStyle=e.flash>0?'#FFF':e.c;cx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2,r=i%2===0?14:8;if(i===0)cx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}}
else if(e.t==='tank'){if(IMGS.tank&&IMGS.tank.complete&&e.flash<=0){cx.drawImage(IMGS.tank,-20,-20,40,40)}else{cx.fillStyle=e.flash>0?'#FFF':e.c;cx.fillRect(-17,-17,34,34);cx.fillStyle='rgba(0,0,0,0.2)';cx.fillRect(-12,-12,24,24);cx.fillStyle='rgba(0,0,0,0.15)';cx.fillRect(-6,-20,12,8)}}
cx.globalAlpha=1;cx.restore()}

function drawBullet(b){cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.2);g.addColorStop(0,b.c+'55');g.addColorStop(1,b.c+'00');cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r*2.2,0,Math.PI*2);cx.fill()}

function drawPowerUp(p){cx.save();cx.translate(p.x,p.y+Math.sin(fc*0.08)*3);const c=p.tp==='power'?'#5DCAA5':p.tp==='beam'?'#85B7EB':p.tp==='speed'?'#FAC775':'#97C459';
const og=cx.createRadialGradient(0,0,4,0,0,16);og.addColorStop(0,c+'44');og.addColorStop(1,c+'00');cx.fillStyle=og;cx.beginPath();cx.arc(0,0,16,0,Math.PI*2);cx.fill();
cx.fillStyle=c;cx.beginPath();cx.arc(0,0,10,0,Math.PI*2);cx.fill();cx.fillStyle='#fff';cx.font='bold 11px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.tp==='power'?'P':p.tp==='beam'?'B':p.tp==='speed'?'S':'♥',0,1);cx.restore()}

function drawCrosshair(){if(!mousePos||state!=='playing')return;cx.save();cx.translate(mousePos.x,mousePos.y);cx.rotate(fc*0.02);
cx.strokeStyle='rgba(175,169,236,0.4)';cx.lineWidth=1;cx.beginPath();cx.arc(0,0,10,0,Math.PI*2);cx.stroke();
cx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2;cx.moveTo(Math.cos(a)*14,Math.sin(a)*14);cx.lineTo(Math.cos(a)*6,Math.sin(a)*6)}cx.stroke();cx.restore()}

function drawHUD(){
cx.fillStyle='#D3D1C7';cx.font='14px sans-serif';cx.textAlign='left';cx.fillText('Score: '+score.toLocaleString(),12,24);
cx.textAlign='right';cx.fillText('Stage '+stage,W-12,24);cx.textAlign='left';
for(let i=0;i<lives;i++){cx.fillStyle='#E24B4A';cx.beginPath();const hx=12+i*20,hy=38;cx.moveTo(hx,hy+3);cx.bezierCurveTo(hx,hy,hx-5,hy-3,hx-7,hy);cx.bezierCurveTo(hx-11,hy+5,hx,hy+12,hx,hy+14);cx.bezierCurveTo(hx,hy+12,hx+11,hy+5,hx+7,hy);cx.bezierCurveTo(hx+5,hy-3,hx,hy,hx,hy+3);cx.fill()}
if(pw>0){cx.fillStyle='#5DCAA5';cx.font='12px sans-serif';cx.textAlign='right';cx.fillText('Power: '+'★'.repeat(pw),W-12,42)}
if(!bossSpawned){let kt2=6+stage*3;if(stage===5)kt2=Math.ceil(kt2*1.2);if(stage===6)kt2=33;const pct=Math.min(1,killCount/kt2);const th=THEMES[stage]||THEMES[1];cx.fillStyle='rgba(0,0,0,0.35)';cx.fillRect(W/2-50,8,100,5);cx.fillStyle=th[1]+'0.8)';cx.fillRect(W/2-50,8,100*pct,5);cx.fillStyle='#888';cx.font='10px sans-serif';cx.textAlign='center';cx.fillText(Math.min(killCount,kt2)+'/'+kt2,W/2,24)}
if(beam.on&&!ngPlus){const pct=beam.t/210;cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(W/2-60,H-22,120,7);cx.fillStyle='#85B7EB';cx.fillRect(W/2-60,H-22,120*pct,7);cx.fillStyle='rgba(255,255,255,0.3)';cx.fillRect(W/2-60,H-22,120*pct,3);cx.fillStyle='#B5D4F4';cx.font='11px sans-serif';cx.textAlign='center';cx.fillText('BEAM',W/2,H-28)}
if(ngPlus){cx.textAlign='left';cx.font='12px sans-serif';cx.fillStyle='#FAC775';cx.fillText('∞ BEAM MODE ∞',12,H-10)}
else if(beam.stock>0||beam.on){cx.textAlign='left';cx.font='12px sans-serif';cx.fillStyle='#85B7EB';cx.fillText('Beam: '+'◆'.repeat(beam.stock)+(beam.on||beam.stock===0?'':'  [Space]'),12,H-10)}
if(speedBoost.active){const pct=speedBoost.timer/300;cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(W/2-60,H-34,120,7);cx.fillStyle='#FAC775';cx.fillRect(W/2-60,H-34,120*pct,7);cx.fillStyle='rgba(255,255,255,0.3)';cx.fillRect(W/2-60,H-34,120*pct,3);cx.fillStyle='#FAC775';cx.font='11px sans-serif';cx.textAlign='center';cx.fillText('SPEED x1.5',W/2,H-40)}
if(comboDisplay>0&&combo>1){const a=Math.min(1,comboDisplay/20);cx.globalAlpha=a;cx.fillStyle=combo>=8?'#FAC775':combo>=5?'#ED93B1':'#AFA9EC';cx.font=(16+Math.min(combo,10)*2)+'px sans-serif';cx.textAlign='center';cx.fillText(combo+' COMBO!',W/2,H*0.45);if(combo>=5){cx.font='12px sans-serif';cx.fillText('x'+Math.min(combo,10),W/2,H*0.45+20)}cx.globalAlpha=1}}

function drawWarning(){if(warningTimer<=0)return;const a=Math.sin(warningTimer*0.15)*0.5+0.5;cx.globalAlpha=a*0.8;cx.fillStyle='#E24B4A';cx.font='bold 36px sans-serif';cx.textAlign='center';cx.fillText('WARNING',W/2,H/2-20);cx.font='14px sans-serif';cx.fillStyle='#F09595';cx.fillText(BNAMES[stage]+' が現れる！',W/2,H/2+10);cx.globalAlpha=1;cx.strokeStyle='rgba(226,75,74,'+a*0.3+')';cx.lineWidth=4;cx.strokeRect(2,2,W-4,H-4)}

function drawStageAnnounce(){if(stageAnnounce<=0)return;const p=1-stageAnnounce/120;let a;if(p<0.2)a=p/0.2;else if(p>0.7)a=(1-p)/0.3;else a=1;
cx.globalAlpha=a;cx.fillStyle='#E6D5FF';cx.font='bold 28px sans-serif';cx.textAlign='center';cx.fillText('STAGE '+stage+(ngPlus?' EX':''),W/2,H/2-10);
cx.font='14px sans-serif';cx.fillStyle='#AFA9EC';cx.fillText(SNAMES[stage]||'',W/2,H/2+16);cx.globalAlpha=1}

function draw(){const th=THEMES[stage]||THEMES[1];cx.fillStyle=th[0];cx.fillRect(0,0,W,H);
cx.save();cx.translate(shake.x,shake.y);drawStars();drawNebula();
if(state==='title'){const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,200);g.addColorStop(0,'rgba(127,119,221,0.12)');g.addColorStop(1,'rgba(13,11,26,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.restore();return}
if(state!=='playing'&&state!=='gameover'&&state!=='clear'&&state!=='win'){cx.restore();return}
pt.forEach(p=>{cx.globalAlpha=p.l/p.ml;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r*(p.l/p.ml),0,Math.PI*2);cx.fill()});cx.globalAlpha=1;
drawBeam();pu.forEach(drawPowerUp);bl.forEach(drawBullet);eb.forEach(drawBullet);en.forEach(drawEnemy);
if(state==='playing'){drawPlayer();drawCrosshair()}drawHUD();drawWarning();drawStageAnnounce();cx.restore()}

function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
